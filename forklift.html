<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maze Carroll Replenishment</title>
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#F5F6F8;color:#222}
  .hdr{background:#B9770E;color:#FFF;padding:14px 16px;font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  .wrap{padding:14px;max-width:600px;margin:0 auto}
  .status{text-align:center;padding:20px;color:#888;font-size:14px}
  .task{background:#FFF;border-radius:8px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:2px solid #F0D98C}
  .task-sku{font-weight:700;font-size:16px;color:#1F3864}
  .task-desc{font-size:13px;color:#555;margin-top:2px}
  .task-empty{margin-top:8px;font-size:13px;color:#A32D2D;font-weight:700}
  .reserve-label{font-size:12px;color:#666;margin-top:10px;margin-bottom:4px}
  .reserve-option{background:#EAF7EE;border:1.5px solid #8CD98C;border-radius:6px;padding:10px 12px;margin-bottom:6px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;align-items:center}
  .reserve-option:active{background:#D4EFDA}
  .reserve-bay{font-weight:700;color:#1F3864}
  .reserve-qty{font-weight:700;color:#1E8449}
  .no-reserves{font-size:12px;color:#A32D2D;margin-top:8px}
  .login-box{background:#FFF;border-radius:8px;padding:20px;text-align:center;margin-top:40px}
  .login-btn{background:#B9770E;color:#FFF;border:none;border-radius:8px;padding:12px 24px;font-size:15px;font-weight:700;cursor:pointer}
  .refresh-btn{background:none;border:none;color:#FFF;font-size:13px;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div class="hdr"><span>🚜 Replenishment</span><button class="refresh-btn" onclick="loadTasks()">Refresh</button></div>
<div class="wrap">
  <div id="loginBox" class="login-box">
    <div style="margin-bottom:12px;font-weight:600">Enter your replenishment access code</div>
    <input type="password" id="codeInput" placeholder="Access code" style="width:100%;padding:10px;font-size:15px;border-radius:8px;border:1.5px solid #CCC;margin-bottom:10px;box-sizing:border-box"/>
    <button class="login-btn" onclick="doLogin()">Log in</button>
  </div>
  <div id="mainBox" style="display:none">
    <div style="background:#FFF;border-radius:8px;padding:12px 14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)">
      <div style="font-size:13px;font-weight:700;color:#1F3864;margin-bottom:6px">Choose what to replenish yourself</div>
      <div style="display:flex;gap:6px">
        <input type="text" id="skuSearchInput" placeholder="Type a SKU..." style="flex:1;padding:8px 10px;font-size:14px;border-radius:6px;border:1.5px solid #CCC"/>
        <button class="login-btn" style="padding:8px 14px;font-size:13px" onclick="searchSku()">Search</button>
      </div>
      <div id="skuSearchResult" style="margin-top:10px"></div>
    </div>
    <div id="tasksBox"></div>
  </div>
</div>
<script>
// CHANGE THIS to match FORKLIFT_ACCESS_CODE in your Apps Script Script
// Properties -- this is the one and only credential this page uses, and
// it can ONLY perform replenish_move (server-side enforced, see Code.gs).
var SHEET_API = 'https://script.google.com/macros/s/AKfycbwQaeYMqlrC6EUYStRFKnEY9eiCSCqSaoadHn2EhbClkXclUWWvaXs3VpbTY3jeGBko/exec';
var accessCode = '';

function jsonpFetchForklift(params) {
  return new Promise(function(resolve, reject) {
    var cbName = 'jsonpFkCb' + Date.now() + Math.floor(Math.random() * 100000);
    var script = document.createElement('script');
    var done = false;
    var timer = setTimeout(function() { if (done) return; done = true; cleanup(); reject(new Error('timed out')); }, 15000);
    function cleanup() { delete window[cbName]; if (script.parentNode) script.parentNode.removeChild(script); clearTimeout(timer); }
    window[cbName] = function(data) { if (done) return; done = true; cleanup(); resolve(data); };
    script.src = SHEET_API + '?ac=' + encodeURIComponent(accessCode) + '&' + params + '&callback=' + cbName + '&t=' + Date.now();
    script.onerror = function() { if (done) return; done = true; cleanup(); reject(new Error('could not load')); };
    document.head.appendChild(script);
  });
}

function doLogin() {
  var entered = document.getElementById('codeInput').value.trim();
  if (!entered) return;
  accessCode = entered;
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('mainBox').style.display = 'block';
  loadTasks();
}

function fl(loc) {
  var p = loc.split('-');
  return p[0] + '-B' + parseInt(p[1], 10) + '-L' + p[2];
}

// Manual, proactive path: driver types any SKU and sees its pick bay +
// reserve options directly, regardless of whether it's auto-flagged as
// urgently empty. Confirmed needed 18 Aug 2026: since picks aren't synced
// to Unleashed yet, everything here runs off this app's own stock counts,
// and the driver should be able to choose what to replenish themselves,
// not only react to the zero-stock task list.
function searchSku() {
  var sku = document.getElementById('skuSearchInput').value.trim();
  var box = document.getElementById('skuSearchResult');
  if (!sku) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="status">Searching...</div>';
  jsonpFetchForklift('replenishmentskusearch=1&sku=' + encodeURIComponent(sku)).then(function(data) {
    if (!data || !data.found) {
      box.innerHTML = '<div class="no-reserves">' + (data && data.error ? data.error : 'Not found.') + '</div>';
      return;
    }
    window.lastSkuSearchResult = data;
    var reservesHtml;
    if (!data.reserves.length) {
      reservesHtml = '<div class="no-reserves">No reserve stock found elsewhere for this SKU.</div>';
    } else {
      reservesHtml = '<div class="reserve-label">Tap where you\'re taking it from:</div>' +
        data.reserves.map(function(r, ri) {
          return '<div class="reserve-option" onclick="confirmReplenishFromSearch(' + ri + ')">' +
            '<span class="reserve-bay">' + r.bayCode + '</span><span class="reserve-qty">' + r.qty + ' units</span>' +
            '</div>';
        }).join('');
    }
    box.innerHTML = '<div class="task" style="border-color:#8CD98C">' +
      '<div class="task-sku">' + data.sku + '</div>' +
      '<div class="task-desc">' + (data.desc || '') + '</div>' +
      '<div style="margin-top:8px;font-size:13px;color:#1F3864;font-weight:700">Pick bay: ' + data.pickBayCode + ' (currently ' + (data.pickBayQty != null ? data.pickBayQty : '?') + ' units)</div>' +
      reservesHtml +
      '</div>';
  }).catch(function() {
    box.innerHTML = '<div class="no-reserves">Could not search -- check your connection.</div>';
  });
}

function confirmReplenishFromSearch(reserveIndex) {
  var data = window.lastSkuSearchResult;
  var reserve = data.reserves[reserveIndex];
  if (!confirm('Move ' + reserve.qty + ' units of ' + data.sku + ' from ' + reserve.bayCode + ' to pick bay ' + data.pickBayCode + '?')) return;
  jsonpFetchForklift('beacon=1&type=replenish_move&sku=' + encodeURIComponent(data.sku) + '&fromLoc=' + encodeURIComponent(reserve.loc) + '&toLoc=' + encodeURIComponent(data.pickBayLoc)).then(function(result) {
    if (result && result.ok) {
      alert('Done! ' + reserve.bayCode + ' is now empty, pick bay ' + data.pickBayCode + ' refilled with ' + result.qtyMoved + '.');
    } else {
      alert('Could not complete: ' + (result && result.error ? result.error : 'unknown error'));
    }
    document.getElementById('skuSearchInput').value = '';
    document.getElementById('skuSearchResult').innerHTML = '';
    loadTasks();
  }).catch(function() {
    alert('Could not reach the server -- check your connection and try again.');
  });
}

function loadTasks() {
  if (!accessCode) return;
  var box = document.getElementById('tasksBox');
  box.innerHTML = '<div class="status">Loading tasks...</div>';
  jsonpFetchForklift('replenishmenttasks=1').then(function(data) {
    if (!data || data.accessDenied) {
      box.innerHTML = '<div class="status" style="color:#A32D2D">Access code not recognized. <a href="javascript:void(0)" onclick="location.reload()">Try again</a></div>';
      return;
    }
    if (!data.tasks || !data.tasks.length) {
      box.innerHTML = '<div class="status">No replenishment needed right now \ud83c\udf89</div>';
      return;
    }
    box.innerHTML = '<div style="font-size:12px;color:#666;margin-bottom:10px">Checked ' + (data.checkedAt || '') + ' -- ' + data.tasks.length + ' pick bay(s) need refilling</div>' +
      data.tasks.map(function(t, ti) {
        var reservesHtml;
        if (!t.reserves.length) {
          reservesHtml = '<div class="no-reserves">\u26a0\ufe0f No reserve stock found elsewhere -- may need reordering.</div>';
        } else {
          reservesHtml = '<div class="reserve-label">Tap where you\'re taking it from:</div>' +
            t.reserves.map(function(r, ri) {
              return '<div class="reserve-option" onclick="confirmReplenish(' + ti + ',' + ri + ')">' +
                '<span class="reserve-bay">' + r.bayCode + '</span><span class="reserve-qty">' + r.qty + ' units</span>' +
                '</div>';
            }).join('');
        }
        return '<div class="task">' +
          '<div class="task-sku">' + t.sku + '</div>' +
          '<div class="task-desc">' + (t.desc || '') + '</div>' +
          '<div class="task-empty">\ud83d\udce6 Pick bay empty: ' + t.pickBayCode + '</div>' +
          reservesHtml +
          '</div>';
      }).join('');
    window.lastTasksData = data.tasks;
  }).catch(function() {
    box.innerHTML = '<div class="status" style="color:#A32D2D">Could not load tasks. <a href="javascript:void(0)" onclick="loadTasks()">Retry</a></div>';
  });
}

// Two clicks total: tapping the reserve option (above) is click one; this
// confirm dialog is click two. Only after confirming does the actual move
// get sent -- matches "he clicks twice and that's it."
function confirmReplenish(taskIndex, reserveIndex) {
  var task = window.lastTasksData[taskIndex];
  var reserve = task.reserves[reserveIndex];
  if (!confirm('Move ' + reserve.qty + ' units of ' + task.sku + ' from ' + reserve.bayCode + ' to pick bay ' + task.pickBayCode + '?')) return;
  jsonpFetchForklift('beacon=1&type=replenish_move&sku=' + encodeURIComponent(task.sku) + '&fromLoc=' + encodeURIComponent(reserve.loc) + '&toLoc=' + encodeURIComponent(task.pickBayLoc)).then(function(result) {
    if (result && result.ok) {
      alert('Done! ' + reserve.bayCode + ' is now empty, pick bay ' + task.pickBayCode + ' refilled with ' + result.qtyMoved + '.');
    } else {
      alert('Could not complete: ' + (result && result.error ? result.error : 'unknown error'));
    }
    loadTasks();
  }).catch(function() {
    alert('Could not reach the server -- check your connection and try again.');
  });
}

// Refresh automatically every 30 seconds so newly-flagged pick bays show
// up without the driver needing to tap Refresh themselves.
setInterval(function() { if (accessCode) loadTasks(); }, 30000);
</script>
</body>
</html>
